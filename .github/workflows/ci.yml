name: LibrePaq Pro — CI & Fiscal Invariants Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck, Fiscal Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: 1. Strict TypeScript Analysis (tsc --noEmit)
        run: bun run typecheck

      - name: 2. Fiscal Engines & NASA Architectural Invariants (bun test)
        run: bun test

      - name: 3. Production Bundle & Code Splitting (bun run build)
        run: bun run build
